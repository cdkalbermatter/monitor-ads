name: auto-flag-campanas
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
concurrency:
  group: flagger
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Poner bandera a campañas nuevas de tejido
        env:
          UTMIFY_URL: ${{ secrets.UTMIFY_URL }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
        run: python flag_campaigns.py
