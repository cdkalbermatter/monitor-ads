name: auto-pausa-costcap

on:
  schedule:
    - cron: "*/15 * * * *"   # intenta relanzar seguido; el loop interno cubre los atrasos del cron
  workflow_dispatch: {}

# Un solo loop vivo a la vez; cuando el cron logra dispararse, reinicia con codigo fresco (sin backlog).
concurrency:
  group: costcap-live
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Monitor cost-cap/aisladas EN VIVO (gasto Meta ~60s, ventas Utmify)
        env:
          UTMIFY_URL: ${{ secrets.UTMIFY_URL }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
          LOOP_MIN: "110"
        run: python costcap_live.py
